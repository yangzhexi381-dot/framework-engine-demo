<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework Engine</title>
<style>
:root {
  color-scheme: dark;
  font: 16px/1.55 system-ui, sans-serif;
  color: #eef4ff;
  background: #0b1220;
  --muted: #a7b5c9;
  --accent: #8ee3cb;
  --border: #364762;
}

* { box-sizing: border-box; }
body { margin: 0; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px max(16px, calc((100% - 920px) / 2));
  border-bottom: 1px solid var(--border);
}
main { max-width: 960px; padding: 20px 20px 48px; margin: auto; }
h1 { font-size: clamp(1.85rem, 5vw, 2.7rem); margin-bottom: 0; }
h2 { margin: 0 0 12px; font-size: 1.25rem; }
.intro p, .muted { color: var(--muted); }
.grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 16px; }
.card {
  background: #141f31;
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  padding: clamp(16px, 3vw, 24px);
}
.cell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 16px 0;
}
.arrow, .voltage { color: var(--accent); }
.voltage { font-weight: 750; font-size: clamp(2.25rem, 5vw, 3rem); }
.voltage small { font-size: 1.1rem; }
.params { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.params label { display: grid; gap: 5px; }
input, select, button {
  min-width: 0;
  min-height: 44px;
  padding: 8px 12px;
  font: inherit;
  color: inherit;
  background: #0d1726;
  border: 1px solid var(--border);
  border-radius: 8px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note, .state { border-left: 3px solid var(--accent); padding: 10px 12px; }
.toolbar, .choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.import { display: grid; gap: 5px; max-width: 100%; }
.ending { color: var(--accent); }
.error { background: #542a35; border-radius: 8px; margin-bottom: 12px; padding: 12px; }

@media (max-width: 680px) {
  main { padding-inline: 14px; }
  .grid, .params { grid-template-columns: 1fr; }
  .cell { flex-wrap: wrap; }
  header label { display: grid; }
}
</style>
<div id="app"></div>

    <section class="card story">
      <p class="narrative">${escapeHtml(node.text)}</p>
      <div class="state">\u4E3B\u706F ${state.lightOn ? "\u5DF2\u4EAE" : "\u672A\u4EAE"} \xB7 \u72B6\u6001\u8BB0\u5F55 ${state.history.length} \u6B65</div>
      <div class="choices">${actions}</div>
    </section>`;
  }
  function render() {
    const apps = engine.list();
    const active = apps.find((app) => app.id === engine.activeId);
    root.innerHTML = `
    <header>
      <strong>Framework Engine</strong>
      <label>\u793A\u4F8B <select id="framework">${apps.map(
      (app) => `<option value="${escapeHtml(app.id)}" ${app === active ? "selected" : ""}>${escapeHtml(app.name)}</option>`
    ).join("")}</select></label>
    </header>
    <main>
      <section class="intro">
        <h1>${escapeHtml(active.name)}</h1>
        <p>${escapeHtml(active.description)}</p>
      </section>
      <div id="demo-error" class="error" role="alert" hidden></div>
      ${active.id === "chemistry" ? chemistryView(engine.state) : storyView(engine.state)}
      <section class="toolbar">
        <button type="button" id="reset">\u91CD\u7F6E\u793A\u4F8B</button>
        <button type="button" id="export">\u5BFC\u51FA JSON</button>
        <label class="import">\u5BFC\u5165 JSON <input id="import" type="file" accept="application/json,.json"></label>
      </section>
    </main>`;
  }
  function showError(error) {
    const target = root.querySelector("#demo-error");
    target.hidden = false;
    target.textContent = error.message;
  }
  function perform(action) {
    try {
      action();
    } catch (error) {
      showError(error);
    }
  }
  root.addEventListener("submit", (event) => {
    if (event.target.id !== "chem-form") return;
    event.preventDefault();
    const values = Object.fromEntries(
      [...new FormData(event.target)].map(([key, value]) => [key, Number(value)])
    );
    perform(() => engine.dispatch({ type: "set-parameters", values }));
  });
  root.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.id === "reset") perform(() => engine.reset());
    if (button.hasAttribute("data-choice")) {
      perform(() => engine.dispatch({ type: "choose", index: Number(button.dataset.choice) }));
    }
    if (button.id === "export") {
      const link = document.createElement("a");
      const url = URL.createObjectURL(new Blob([engine.exportData()], { type: "application/json" }));
      link.href = url;
      link.download = `fe-${engine.activeId}-state.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1e3);
    }
  });
  root.addEventListener("change", async (event) => {
    if (event.target.id === "framework") perform(() => engine.load(event.target.value));
    if (event.target.id !== "import" || !event.target.files[0]) return;
    const target = event.target;
    try {
      const data = await target.files[0].text();
      if (target.isConnected) engine.importData(data);
    } catch (error) {
      if (target.isConnected) {
        target.value = "";
        showError(error);
      }
    }
  });
  engine.events.subscribe("framework:loaded", render);
  engine.events.subscribe("state:changed", render);
  engine.load("chemistry");
})();
</script>
</html>
